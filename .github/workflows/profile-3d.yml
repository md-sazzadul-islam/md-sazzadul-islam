name: Profile graphics

on:
  schedule:
    - cron: "0 18 * * *" # daily, 00:00 Dhaka time
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-3d.yml", "scripts/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: 3D stats card
        run: python3 scripts/stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Commit generated graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib assets/stats.svg assets/stats-dark.svg
          git diff --cached --quiet || (git commit -m "chore: refresh profile graphics" && git push)
