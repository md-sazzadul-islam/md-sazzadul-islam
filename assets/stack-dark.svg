    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffa3a6"/><stop offset="1" stop-color="#ff6b70"/></linearGradient>
    <linearGradient id="mobile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf9"/><stop offset="1" stop-color="#f1d6d2"/></linearGradient>
    <linearGradient id="data" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a676b"/><stop offset="1" stop-color="#5f4447"/></linearGradient>
    <linearGradient id="tools" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6efed"/></linearGradient>
    <radialGradient id="sh" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000000" stop-opacity=".25"/><stop offset="1" stop-color="#000000" stop-opacity="0"/></radialGradient>
  </defs>
