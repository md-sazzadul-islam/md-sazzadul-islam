    .w1{animation-delay:-4.6s}
    .w2{animation-delay:-4.2s}
    .w3{animation-delay:-3.8s}
    .w4{animation-delay:-3.4s}
    .w5{animation-delay:-3.0s}
    .w6{animation-delay:-2.6s}
    @keyframes w{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @media (prefers-reduced-motion:reduce){.w{animation:none}}
  </style>
